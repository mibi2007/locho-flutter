name: flutter_app
description: Locho notes for Android, iOS, and the browser with a shared Flutter UI.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  locho_notes:
    path: packages/locho_notes
  http: 1.6.0
  flutter_widget_from_html_core: ^0.17.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
